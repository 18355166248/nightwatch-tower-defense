<main><h1>机枪塔三级 × 八方向</h1>
<p>独立生成升级部件，不使用运行截图替代设计稿。保持固定底座、画布及双管坐标。128px 原切图上的粉点为程序注册炮口，青点为安装轴；升级须核对炮口而非机械套用中心。图示不是全方向实战验收。</p>
<p>一级：基础铜金／深蓝炮头。二级：炮管加固环＋肩板。三级：厚肩甲＋后部散热脊。保留原有射速和伤害规则。</p>
<div id="families"></div>
<p><a href="eight-direction-head.html">代表稿与来源</a> · <a href="EIGHT-DIRECTION-HEAD.md">实现／验证记录</a></p>

const directions=['north','north-east','east','south-east','south','south-west','west','north-west'];

","https://audiopaytest.cos.tx.xmcdn.com/storages/fbf6-audiotest/D7/07/GAqSoUUOlQxLAABL-QACF0jj.png","https://audiopaytest.cos.tx.xmcdn.com/storages/3f33-audiotest/E2/17/GAqSiIMOlQxMAABGHQACF0jk.png","https://audiopaytest.cos.tx.xmcdn.com/storages/40e0-audiotest/32/E9/GAqSoUUOlQxMAABBLAACF0jn.png","https://audiopaytest.cos.tx.xmcdn.com/storages/0fe5-audiotest/86/C4/GAqSoUUOlQxMAABJXAACF0jl.png"]];
const imagePath=(level,index)=>imageUrls[level-1][index];
const points=[[68,102,54,31,82,31],[61,101,70,29,93,42],[61,99,101,49,104,73],[62,92,100,72,79,89],[68,87,55,77,82,77],[67,94,27,55,47,69],[66,99,22,40,20,64],[64,100,32,34,54,18]];
for(let level=1;level<=3;level++){
 const h=document.createElement('h2');h.textContent='等级 '+level+' · 128px 配准';document.getElementById('families').append(h);
 const grid=document.createElement('div');grid.className='grid';
 directions.forEach((direction,i)=>{
  const figure=document.createElement('figure'),cell=document.createElement('div'),image=document.createElement('img');cell.className='cell';
  image.src=imagePath(level,i);image.alt='等级'+level+' '+direction;cell.append(image);
  for(let p=0;p<3;p++){const dot=document.createElement('span');dot.className='mark'+(p===0?' pivot':'');dot.style.left=points[i][p*2]+'px';dot.style.top=points[i][p*2+1]+'px';cell.append(dot);}
  const caption=document.createElement('figcaption');caption.textContent=direction;figure.append(cell,caption);grid.append(figure);
 });document.getElementById('families').append(grid);
}
const smallHeading=document.createElement('h2');smallHeading.textContent='64px 画布 · 同方向三级对照';document.getElementById('families').append(smallHeading);
for(const direction of ['north','south-east','west']){const row=document.createElement('div');row.className='small';const label=document.createElement('span');label.textContent=direction;row.append(label);for(let level=1;level<=3;level++){const image=document.createElement('img');image.src=imagePath(level,directions.indexOf(direction));image.alt='64px等级'+level;row.append(image);}document.getElementById('families').append(row);}
</script></main></html>
